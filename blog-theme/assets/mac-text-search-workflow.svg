<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="t d">
<title id="t">Three ways to work with text inside images and PDFs on a Mac</title>
<desc id="d">Use Preview Live Text to copy words from one image, Preview Find to search a text PDF, or MacEx Text Search to find recognized words across images and PDFs in your MacEx library.</desc>
<rect width="1080" height="560" rx="30" fill="#f3f5fa"/>
<text x="540" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17243a">Choose the right kind of search</text>
<g font-family="Arial,sans-serif">
<rect x="55" y="112" width="300" height="375" rx="22" fill="#fff" stroke="#d8e0eb" stroke-width="2"/>
<rect x="390" y="112" width="300" height="375" rx="22" fill="#fff" stroke="#d8e0eb" stroke-width="2"/>
<rect x="725" y="112" width="300" height="375" rx="22" fill="#fff" stroke="#d8e0eb" stroke-width="2"/>
<rect x="83" y="143" width="244" height="136" rx="14" fill="#eaf0ff"/>
<rect x="114" y="165" width="182" height="92" rx="8" fill="#fff" stroke="#b8c7e4"/>
<text x="205" y="194" font-size="13" fill="#60708b" text-anchor="middle">PHOTO / SCREENSHOT</text>
<text x="205" y="223" font-size="18" fill="#273c67" text-anchor="middle" font-weight="700">Wi-Fi: Bluebird-7</text>
<text x="205" y="245" font-size="13" fill="#60708b" text-anchor="middle">select the visible words</text>
<text x="205" y="318" font-size="15" fill="#64748b" text-anchor="middle" font-weight="700">ONE IMAGE</text>
<text x="205" y="354" font-size="23" fill="#17243a" text-anchor="middle" font-weight="700">Preview + Live Text</text>
<text x="205" y="387" font-size="15" fill="#52627a" text-anchor="middle">Select and copy text</text>
<text x="205" y="410" font-size="15" fill="#52627a" text-anchor="middle">from the open image</text>
<text x="205" y="454" font-size="13" fill="#65758d" text-anchor="middle">Manual, one file at a time</text>
<rect x="418" y="143" width="244" height="136" rx="14" fill="#edf5f2"/>
<rect x="451" y="160" width="178" height="103" rx="6" fill="#fff" stroke="#b8d6c9"/>
<path d="M477 184 H603 M477 199 H603 M477 214 H584 M477 229 H597" stroke="#8ba99d" stroke-width="4" stroke-linecap="round"/>
<circle cx="596" cy="245" r="12" fill="#d5eadf"/>
<text x="540" y="318" font-size="15" fill="#64748b" text-anchor="middle" font-weight="700">ONE PDF</text>
<text x="540" y="354" font-size="23" fill="#17243a" text-anchor="middle" font-weight="700">Preview + Find</text>
<text x="540" y="387" font-size="15" fill="#52627a" text-anchor="middle">Search its text layer</text>
<text x="540" y="410" font-size="15" fill="#52627a" text-anchor="middle">with Command-F</text>
<text x="540" y="454" font-size="13" fill="#65758d" text-anchor="middle">Scans may need OCR first</text>
<rect x="753" y="143" width="244" height="136" rx="14" fill="#f1edff"/>
<g fill="#fff" stroke="#c7bce9" stroke-width="2">
<rect x="790" y="163" width="60" height="75" rx="6"/><rect x="862" y="163" width="60" height="75" rx="6"/><rect x="934" y="163" width="36" height="75" rx="6"/>
</g>
<g stroke="#9281ca" stroke-width="3" stroke-linecap="round">
<path d="M802 183 H838 M802 195 H835 M802 207 H829 M874 183 H910 M874 195 H907 M874 207 H901 M942 183 H961 M942 195 H961 M942 207 H958"/>
</g>
<text x="875" y="318" font-size="15" fill="#64748b" text-anchor="middle" font-weight="700">MANY FILES</text>
<text x="875" y="354" font-size="23" fill="#17243a" text-anchor="middle" font-weight="700">MacEx Text Search</text>
<text x="875" y="387" font-size="15" fill="#52627a" text-anchor="middle">Index recognized words</text>
<text x="875" y="410" font-size="15" fill="#52627a" text-anchor="middle">across your library</text>
<text x="875" y="454" font-size="13" fill="#65758d" text-anchor="middle">Opt-in, on-device recognition</text>
</g>
<text x="540" y="526" font-family="Arial,sans-serif" font-size="13" fill="#7b8798" text-anchor="middle">The right method depends on whether you need one file or a searchable library.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">System Data and purgeable space are different</title>
<desc id="desc">Two panels compare the System Settings storage categories with Disk Utility's free and purgeable space. Available space can include both free and purgeable space.</desc>
<rect width="1080" height="560" rx="28" fill="#f2f5fa"/>
<text x="64" y="78" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#26354b">Two screens. Two different measurements.</text>
<rect x="64" y="116" width="452" height="340" rx="20" fill="#fff" stroke="#dbe3ed" stroke-width="2"/>
<text x="96" y="163" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#4759a8">SYSTEM SETTINGS</text>
<text x="96" y="198" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#26354b">Storage categories</text>
<g font-family="Arial,sans-serif" font-size="16" fill="#44546a">
<rect x="96" y="226" width="388" height="42" rx="8" fill="#f3f6fb"/><circle cx="119" cy="247" r="7" fill="#8ca4d8"/><text x="139" y="253">Applications, Documents, Photos…</text>
<rect x="96" y="278" width="388" height="52" rx="8" fill="#eef1f7"/><circle cx="119" cy="304" r="7" fill="#a2aab9"/><text x="139" y="310" font-weight="700">System Data</text>
<text x="96" y="366" font-size="15" fill="#65748a">A category of files macOS manages.</text>
<text x="96" y="392" font-size="15" fill="#65748a">It is not a folder you can empty.</text>
</g>
<rect x="564" y="116" width="452" height="340" rx="20" fill="#fff" stroke="#dbe3ed" stroke-width="2"/>
<text x="596" y="163" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#4f8a77">DISK UTILITY</text>
<text x="596" y="198" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#26354b">Available space</text>
<g font-family="Arial,sans-serif">
<rect x="596" y="226" width="388" height="46" rx="8" fill="#edf1f7"/>
<rect x="596" y="226" width="248" height="46" rx="8" fill="#7cae9e"/>
<text x="720" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">Free</text>
<text x="914" y="255" font-size="16" fill="#44546a" font-weight="700" text-anchor="middle">Purgeable</text>
<text x="790" y="322" font-size="22" fill="#26354b" font-weight="700" text-anchor="middle">Free + Purgeable</text>
<text x="790" y="354" font-size="16" fill="#65748a" text-anchor="middle">= Available</text>
<text x="596" y="397" font-size="15" fill="#65748a">macOS can reclaim purgeable space</text>
<text x="596" y="422" font-size="15" fill="#65748a">when it is needed.</text>
</g>
<rect x="64" y="478" width="952" height="48" rx="12" fill="#e5ebf4"/>
<text x="540" y="508" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#34445b">System Data is not the same thing as purgeable space.</text>
</svg>
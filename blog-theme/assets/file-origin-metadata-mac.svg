<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
<title id="title">Where a Mac file came from</title>
<desc id="desc">A conceptual Finder Get Info panel with an example Where from field, alongside reasons source metadata may be missing.</desc>
<rect width="1080" height="520" rx="28" fill="#eef3f9"/>
<rect x="48" y="48" width="984" height="424" rx="22" fill="#ffffff" stroke="#d6dfeb" stroke-width="2"/>
<rect x="48" y="48" width="984" height="58" rx="22" fill="#f2f5fa"/>
<rect x="48" y="84" width="984" height="22" fill="#f2f5fa"/>
<circle cx="80" cy="77" r="7" fill="#edaaa9"/><circle cx="103" cy="77" r="7" fill="#efce8d"/><circle cx="126" cy="77" r="7" fill="#a6d5b2"/>
<text x="540" y="84" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#334155">Finder · Get Info</text>
<rect x="82" y="139" width="430" height="290" rx="16" fill="#fbfcfe" stroke="#dce4ee"/>
<rect x="108" y="166" width="52" height="62" rx="9" fill="#e6ebfb"/>
<path d="M122 181h23v31h-23z M145 181v9h9" fill="none" stroke="#6478c8" stroke-width="2.5" stroke-linejoin="round"/>
<text x="178" y="190" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#27364c">invoice-final.pdf</text>
<text x="178" y="216" font-family="Arial,sans-serif" font-size="14" fill="#718096">PDF document · 248 KB</text>
<line x1="108" y1="251" x2="486" y2="251" stroke="#e2e8f0"/>
<text x="108" y="282" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#596b82">MORE INFO</text>
<rect x="100" y="299" width="394" height="106" rx="10" fill="#f2f6ff"/>
<text x="120" y="329" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#3b4c68">Where from</text>
<text x="120" y="356" font-family="Arial,sans-serif" font-size="14" fill="#526da9">https://example.com/files/invoice.pdf</text>
<text x="120" y="381" font-family="Arial,sans-serif" font-size="12" fill="#8492a6">Example source address only</text>
<rect x="548" y="139" width="438" height="290" rx="16" fill="#fbfcfe" stroke="#dce4ee"/>
<text x="582" y="181" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#27364c">No “Where from” row?</text>
<g font-family="Arial,sans-serif" font-size="16" fill="#526174">
<circle cx="590" cy="224" r="5" fill="#7f95d5"/><text x="610" y="230">The saving app may not record a source</text>
<circle cx="590" cy="272" r="5" fill="#7f95d5"/><text x="610" y="278">A transfer may not preserve metadata</text>
<circle cx="590" cy="320" r="5" fill="#7f95d5"/><text x="610" y="326">Spotlight may not have indexed it yet</text>
</g>
<rect x="582" y="354" width="370" height="46" rx="9" fill="#fff4e5"/>
<text x="767" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#8b6330">Origin is a clue, not a safety check</text>
<text x="540" y="454" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#8a97a8">Illustrative layout · not an actual macOS screenshot</text>
</svg>
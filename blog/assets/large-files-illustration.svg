<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
<title id="title">Find space on your Mac</title>
<desc id="desc">A visual guide that moves from Storage settings to Finder search to safely reviewing large files.</desc>
<rect width="1080" height="520" rx="32" fill="#eef3f9"/>
<rect x="55" y="55" width="970" height="410" rx="24" fill="#fff" stroke="#d8e1ed" stroke-width="2"/>
<rect x="55" y="55" width="970" height="57" rx="24" fill="#edf1f7"/>
<rect x="55" y="90" width="970" height="22" fill="#edf1f7"/>
<circle cx="89" cy="83" r="8" fill="#f3a7a8"/><circle cx="114" cy="83" r="8" fill="#f5cc88"/><circle cx="139" cy="83" r="8" fill="#9fdbb3"/>
<text x="540" y="90" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#304057" font-weight="bold">Find your space</text>
<text x="100" y="159" font-size="16" font-family="Arial,sans-serif" fill="#64748b">STORAGE USED</text>
<rect x="100" y="179" width="880" height="25" rx="10" fill="#ecf0f6"/>
<rect x="100" y="179" width="290" height="25" rx="10" fill="#6478d3"/><rect x="390" y="179" width="190" height="25" fill="#8ab6dd"/><rect x="580" y="179" width="115" height="25" fill="#b6d9c7"/>
<text x="100" y="249" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#26354b">Start with the biggest files</text>
<g font-family="Arial,sans-serif" font-size="18" fill="#334155">
<rect x="100" y="276" width="880" height="50" rx="9" fill="#f5f7fb"/><rect x="117" y="289" width="24" height="24" rx="5" fill="#cdd4f9"/><text x="158" y="308">Old screen recording</text><text x="935" y="308" text-anchor="end" font-weight="bold">4.8 GB</text>
<rect x="100" y="334" width="880" height="50" rx="9" fill="#f5f7fb"/><rect x="117" y="347" width="24" height="24" rx="5" fill="#c9e5ee"/><text x="158" y="366">Archived project export</text><text x="935" y="366" text-anchor="end" font-weight="bold">2.1 GB</text>
<rect x="100" y="392" width="880" height="50" rx="9" fill="#f5f7fb"/><rect x="117" y="405" width="24" height="24" rx="5" fill="#d8e7c5"/><text x="158" y="424">Downloaded installer</text><text x="935" y="424" text-anchor="end" font-weight="bold">1.4 GB</text>

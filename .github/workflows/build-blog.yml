name: Build and publish MacEx blog
on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**'
      - 'scripts/build_blog.py'
      - 'scripts/seo.py'
      - 'scripts/test_blog.py'
      - 'blog-theme/**'
      - '.github/workflows/build-blog.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: macex-blog-publishing
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate blog and update root sitemap
        run: |
          python3 -B scripts/build_blog.py
          python3 -B scripts/seo.py sitemap
      - name: Validate generated website
        run: |
          python3 -B -m unittest discover -s scripts
          python3 -B scripts/build_blog.py --check
          python3 -B scripts/seo.py check --quiet
          git diff --check
      - name: Commit generated output to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/ sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Generate MacEx blog pages and sitemap"
            git push origin HEAD:main
          fi

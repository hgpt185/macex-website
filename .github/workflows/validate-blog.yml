name: Validate blog

on:
  push:
    paths:
      - 'content/posts/**'
      - 'blog-theme/**'
      - 'blog/**'
      - 'scripts/**'
      - 'index.html'
      - '.github/workflows/validate-blog.yml'
  pull_request:
    paths:
      - 'content/posts/**'
      - 'blog-theme/**'
      - 'blog/**'
      - 'scripts/**'
      - 'index.html'
      - '.github/workflows/validate-blog.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B -m unittest discover -s scripts
      - run: python3 -B scripts/build_blog.py --check

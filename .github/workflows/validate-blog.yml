name: Validate site

# Runs on every push and pull request: the checks take seconds, and any page
# change can break a link, a title or the sitemap.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B -m unittest discover -s scripts
      - run: python3 -B scripts/build_blog.py --check
      - run: python3 -B scripts/seo.py sitemap --check
      - run: python3 -B scripts/seo.py check

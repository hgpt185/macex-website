name: Validate site

# Regenerate generated blog files before checking them. Daily publishing first
# commits the source JSON; the publishing workflow then regenerates and commits
# the public HTML and sitemap. This keeps validation useful on both commits.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate the blog from source posts
        run: python3 -B scripts/build_blog.py
      - name: Regenerate the root sitemap
        run: python3 -B scripts/seo.py sitemap
      - run: python3 -B -m unittest discover -s scripts
      - run: python3 -B scripts/build_blog.py --check
      - name: Comparison pages match content/compare (COMPARE-SPEC.md)
        run: python3 -B scripts/build_compare.py --check
      - run: python3 -B scripts/seo.py sitemap --check
      - run: python3 -B scripts/seo.py check
      - run: git diff --check
